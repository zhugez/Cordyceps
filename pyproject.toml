[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cordyceps"
version = "1.1.0"
description = "WordPress plugin vulnerability scanner — Patchstack-grade static analysis. Skill for OpenClaw and Hermes Agent."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "zhugez" }]
requires-python = ">=3.9"
keywords = [
    "security",
    "wordpress",
    "vulnerability-scanner",
    "static-analysis",
    "agentskills",
    "openclaw",
    "hermes",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/zhugez/cordyceps"
Issues = "https://github.com/zhugez/cordyceps/issues"
Source = "https://github.com/zhugez/cordyceps"

[project.scripts]
cordyceps = "scanner:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[tool.setuptools]
py-modules = ["scanner"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length already enforced via line-length
    "B008",  # default arg call (subprocess.run pattern)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
